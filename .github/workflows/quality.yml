name: Repository quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint Agent Skills
        run: python tools/lint-agent-skills.py

      - name: Run unit tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Run canonical worker-flow tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Graph architecture experiment tests
        run: python -m unittest discover -s experiments/graph-engineering/tests -p "test_*.py" -v

      - name: Check diff whitespace
        shell: bash
        run: |
          git diff --check
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi

      - name: Validate strict Loop example
        run: >-
          python skills/loop-engineering/scripts/validate_loop_contract.py
          skills/loop-engineering/references/ci-repair-loop-example.md
          --strict

      - name: Validate strict Graph example
        run: >-
          python skills/graph-engineering/scripts/validate_graph_contract.py
          skills/graph-engineering/references/diamond-graph-example.json
          --strict

      - name: Validate strict runtime envelope example
        run: >-
          python skills/harness-engineering/scripts/validate_runtime_envelope.py
          skills/harness-engineering/references/runtime-envelope-example.json
          --strict

  installer-bash:
    name: Bash installer canary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install into an isolated home
        env:
          THIRD_BRAIN_HOME: ${{ runner.temp }}/third-brain-installer
        run: bash install.sh codex
      - name: Verify the managed manifest
        env:
          THIRD_BRAIN_HOME: ${{ runner.temp }}/third-brain-installer
        run: >-
          python tools/install_skills.py
          --source skills
          --destination "$THIRD_BRAIN_HOME/.agents/skills"
          --check

  installer-powershell:
    name: PowerShell installer canary
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install into an isolated home
        shell: pwsh
        run: |
          $env:THIRD_BRAIN_HOME = Join-Path $env:RUNNER_TEMP "third-brain-installer"
          .\install.ps1 codex
      - name: Verify the managed manifest
        shell: pwsh
        run: |
          $env:THIRD_BRAIN_HOME = Join-Path $env:RUNNER_TEMP "third-brain-installer"
          python tools/install_skills.py --source skills --destination (Join-Path $env:THIRD_BRAIN_HOME ".agents\skills") --check
